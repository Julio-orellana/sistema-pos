<!doctype html>
<html lang="es-GT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!--
      Política de seguridad de contenido: sin scripts remotos, sin conexiones
      salientes desde el renderer. Todo lo que necesite red pasa por el proceso
      principal a través de IPC.

      `pos-foto:` es un esquema propio que sirve el proceso principal, y es la
      ÚNICA vía por la que la ventana ve una imagen del disco. No se admite
      `file:` a propósito: daría acceso a cualquier ruta de la máquina, mientras
      que `pos-foto:` solo entrega archivos de la carpeta de fotos y comprueba
      la ruta antes de abrirlos.

      `pos-foto:` es un esquema propio que sirve el proceso principal, y es la
      ÚNICA vía por la que la ventana ve una imagen del disco. No se admite
      `file:` a propósito: daría acceso a cualquier ruta de la máquina, mientras
      que `pos-foto:` solo entrega archivos de la carpeta de fotos y comprueba
      la ruta antes de abrirlos.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: pos-foto: pos-foto:; connect-src 'self'"
    />
    <!--
      El título de la ventana. La ventana no fija `title`, así que Windows
      muestra ESTE texto en el Administrador de tareas, en Alt+Tab y al pasar
      el mouse por la barra de tareas. Hasta la 1.3.0 decía el nombre de
      trabajo del proyecto (§4.68 de CLAUDE.md). `verify:paquete` lo lee del
      paquete construido y detiene el empaquetado si no dice «POS Jimmy Cano».
    -->
    <title>POS Jimmy Cano</title>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
