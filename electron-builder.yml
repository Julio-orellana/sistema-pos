# ===========================================================================
# Empaquetado de producción. El artefacto que Jimmy Cano instala.
# ===========================================================================
#
# ---------------------------------------------------------------------------
# EL NOMBRE FIJA LA IDENTIDAD DE LA APLICACIÓN, Y ESO NO SE PUEDE DESHACER
# ---------------------------------------------------------------------------
# `productName` no es solo lo que se lee en el escritorio. De él salen TRES
# cosas que quedan atadas para siempre a los datos de la tienda:
#
#   1. **La carpeta de datos**, `%APPDATA%\POS Jimmy Cano\`, donde viven
#      `pos-agricola.db` con todas las ventas, los PDF de los recibos, las
#      fotos de los productos y la bitácora técnica (§8 de CLAUDE.md).
#   2. **La llave con que `safeStorage` cifra la credencial de la nube.** En
#      Windows es DPAPI, y la entrada se deriva del nombre del producto: medido
#      en la fase 3.a (§4.23), un lector con otra identidad NO puede descifrar
#      el archivo, ni siquiera con el archivo delante.
#   3. El nombre del ejecutable y las entradas del menú de inicio.
#
# **Cambiar este nombre en una versión futura deja ilegible toda credencial ya
# guardada y deja huérfana la carpeta de datos de toda terminal instalada**, y
# no hay recuperación automática: habría que reconectar cada terminal a mano y
# mover la base. Con una sola caja es un rato; el día que haya varias, se
# planifica antes de publicar, no después. Está escrito en §4.23 con la
# medición al lado.
#
# Se eligió **POS Jimmy Cano** y no «POS Agricola», que era el valor anterior y
# que nunca llegó a un instalador: sin tilde se lee como un error de tecleo, y
# con tilde mete un carácter no ASCII en una ruta de Windows sin ganar nada. El
# nombre del dueño es además lo que hace inconfundible el ícono en un
# escritorio donde puede haber otras cosas.
#
# `appId` NO cambia: es un identificador, no un nombre visible, y de él salen
# la clave de desinstalación del registro de Windows y la agrupación en la
# barra de tareas. Cambiarlo haría que una versión nueva se instalara al lado
# de la vieja en vez de actualizarla.
# ---------------------------------------------------------------------------
appId: gt.posagricola.desktop
productName: POS Jimmy Cano
# ---------------------------------------------------------------------------
# LA MARCA «Vixo POS» VA EN LOS METADATOS, NUNCA EN `productName`
# ---------------------------------------------------------------------------
# `copyright` llega a `LegalCopyright` de las propiedades del `.exe` y del
# instalador. El publicador («Compañía» en las propiedades del `.exe`,
# «Editor» en «Programas y características») sale de `author` del
# package.json: ver `extraMetadata.author`, más abajo. Ninguno de los dos
# participa de la carpeta de datos ni de la llave de `safeStorage`, que salen
# de `productName` (§4.47 de CLAUDE.md).
copyright: Copyright (c) 2026 Julio Orellana (Vixo POS)

directories:
  buildResources: build
  output: release/${version}

# ---------------------------------------------------------------------------
# QUÉ ENTRA AL PAQUETE. DOS COSAS QUE SE MIDIERON Y QUE NO SON OBVIAS
# ---------------------------------------------------------------------------
# **1. Listar lo que se quiere NO alcanza: hay que excluir por nombre.**
# electron-builder parte de `**/*` y le SUMA los patrones positivos; no los
# usa como lista blanca. El primer instalador que armó esta fase, con solo las
# tres líneas positivas, llevó adentro `src/` entero con sus 93 archivos de
# prueba, `docs/`, `scripts/`, `supabase/`, los `tsconfig` y —lo grave—
# **`.env.nube-pruebas` y `.env.nube-real`**: las contraseñas de los tres
# usuarios de Supabase del proyecto de pruebas, dentro del `.exe` que se le
# manda a Jimmy. Se vio listando el asar del paquete, no leyendo la
# documentación.
#
# **2. `win.files` REEMPLAZA esta lista, no la completa.** También medido: con
# las exclusiones acá arriba y un `win.files` que solo sacaba unos prebuilds,
# el paquete de Windows seguía llevando los `.env`. Por eso la lista vive
# COMPLETA bajo `win:` y esta de acá queda para el paquete de macOS. Si algún
# día se agrega otra plataforma, hay que repetirla ahí también; duplicarla es
# feo y es lo que la herramienta impone.
#
# Comprobado sobre el paquete final: 925 archivos en el asar, ninguno `.env`, y
# en la raíz solo `dist`, `dist-electron`, `package.json` y `node_modules`.
files:
  - dist/**
  - dist-electron/**
  - package.json
  - '!**/.env*'
  - '!src'
  - '!src/**'
  - '!scripts/**'
  - '!docs/**'
  - '!supabase/**'
  - '!build/**'
  - '!release/**'
  - '!coverage/**'
  - '!**/*.md'
  - '!tsconfig*.json'
  - '!*.config.{ts,mts,cts,js,mjs,cjs}'
  - '!electron-builder.yml'
  - '!.vscode/**'
  - '!.github/**'
  # Las pruebas que las propias dependencias publican en npm. `zod` manda 189
  # archivos `.test.ts` y sus carpetas `tests/`: 381 entradas que no se
  # ejecutan nunca en la tienda. Lo encontró `verify:paquete` la primera vez
  # que corrió.
  - '!**/node_modules/**/{__tests__,__mocks__,test,tests,spec}/**'
  - '!**/node_modules/**/*.{test,spec}.{ts,tsx,js,mjs,cjs}'

# ---------------------------------------------------------------------------
# `app.getName()` DENTRO DE LA APLICACIÓN EMPAQUETADA
# ---------------------------------------------------------------------------
# Electron decide la carpeta de datos y la identidad de `safeStorage` con
# `app.getName()`, que lee `productName` —o, si no está, `name`— del
# `package.json` que viaja DENTRO del paquete, no de este archivo. El
# `package.json` del repositorio no tiene `productName` a propósito, así que en
# desarrollo la aplicación se llama `pos-agricola`; `extraMetadata` inyecta el
# nombre solo en el paquete.
#
# **La consecuencia es deliberada: la aplicación de desarrollo y la instalada
# NO comparten carpeta de datos ni credencial.** Es lo correcto —los datos de
# prueba de una máquina de desarrollo no tienen por qué mezclarse con los de la
# tienda— y hay que saberlo para no buscar en la carpeta equivocada.
#
# `author` se inyecta acá por la misma vía y por la misma razón: electron-builder
# toma el publicador de `author.name` del package.json empaquetado
# (`appInfo.companyName`, app-builder-lib 26.15.3). Se cambia SOLO en el
# paquete: el package.json del repositorio sigue diciendo «Julio Orellana».
# `author` no interviene en `app.getName()`, en la carpeta de instalación
# (sale de `productName`) ni en la clave de desinstalación (sale de `appId`),
# así que una versión con este cambio actualiza la instalación anterior en vez
# de instalarse al lado. El valor tiene que ser igual a
# `EMISOR_DEL_CODIGO_REMOTO` (src/main/domain/usuarios/totp.ts); lo exige
# `instalador-marca-y-licencia.test.ts`.
extraMetadata:
  productName: POS Jimmy Cano
  author:
    name: Vixo POS

# El módulo nativo no puede cargarse desde dentro del asar: Windows necesita el
# `.node` como archivo suelto en el disco.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'

# ---------------------------------------------------------------------------
# NO SE RECOMPILA NADA, Y ESO ES LO QUE HACE POSIBLE EMPAQUETAR PARA WINDOWS
# DESDE macOS
# ---------------------------------------------------------------------------
# `better-sqlite3` 13 es la única dependencia nativa del proyecto, y desde esa
# versión trae **binarios precompilados para todas las plataformas dentro del
# propio paquete** (`node_modules/better-sqlite3/prebuilds/`), elegidos en
# tiempo de ejecución por `process.platform`/`process.arch` (ver
# `lib/binding.js`). Están hechos con N-API, así que el mismo archivo sirve
# para cualquier versión de Node o de Electron: no hay un ABI por versión que
# haya que perseguir.
#
# Por eso `npmRebuild` va en `false`: no hay nada que recompilar, y dejarlo en
# `true` haría que el empaquetado intentara compilar C++ para Windows desde
# macOS, que es lo único de todo esto que NO se puede hacer sin una máquina
# Windows. Con esto, el paquete se arma en macOS y se lleva el
# `prebuilds/win32-x64.node` que npm ya bajó.
#
# **Si algún día se agrega una segunda dependencia nativa, hay que comprobar si
# trae prebuilds igual.** Si no los trae, esta línea deja de alcanzar y el
# empaquetado para Windows pasa a necesitar una máquina Windows.
npmRebuild: false

# ---------------------------------------------------------------------------
# LA REVISIÓN DEL PAQUETE, ANTES DE QUE EXISTA EL INSTALADOR
# ---------------------------------------------------------------------------
# `afterPack` corre cuando la aplicación ya está empaquetada pero ANTES de que
# el destino NSIS arme el `.exe`. El guion revisa el asar y, si encuentra algo
# que no debería viajar —un `.env`, `src/`, `docs/`, pruebas, una dependencia
# que no es de producción—, lanza: el empaquetado se aborta y **el instalador
# nunca llega a crearse**.
#
# Va acá y no como un `npm run` aparte a propósito: una revisión que hay que
# acordarse de correr es una revisión que un día no se corre, y lo que estaba
# en juego la primera vez fueron contraseñas de Supabase dentro del `.exe`
# (§4.37 de CLAUDE.md). Igual existe `npm run verify:paquete` para auditar un
# paquete ya armado.
afterPack: scripts/verificacion-de-paquete.cjs

win:
  # ---------------------------------------------------------------------------
  # LOS BINARIOS DE LAS OTRAS PLATAFORMAS NO VIAJAN AL INSTALADOR DE WINDOWS
  # ---------------------------------------------------------------------------
  # `better-sqlite3` trae los ocho prebuilds en el paquete, y sin esto los ocho
  # terminan dentro del instalador de Jimmy: **16 MB de los cuales solo 1.9 MB
  # sirven** (medido sobre el primer paquete armado). Los de macOS y Linux no
  # los puede cargar Windows ni por casualidad, y el de Windows ARM no
  # corresponde al único destino declarado arriba, `x64`.
  #
  # La lista de arriba se repite acá entera porque `win.files` REEMPLAZA a
  # `files`, no lo completa (medido; ver el comentario de `files`). Y la
  # exclusión de los prebuilds ajenos no puede ir arriba: el paquete de macOS
  # necesita `darwin-arm64.node` para poder abrirse en esta misma máquina.
  #
  # **Si algún día la tienda tuviera una máquina Windows ARM**, hay que quitar
  # la tercera línea Y agregar `arm64` al destino; con el `.exe` de x64 andaría
  # igual por emulación, pero eso no está medido y no se afirma.
  files:
    - dist/**
    - dist-electron/**
    - package.json
    - '!**/.env*'
    - '!src'
    - '!src/**'
    - '!scripts/**'
    - '!docs/**'
    - '!supabase/**'
    - '!build/**'
    - '!release/**'
    - '!coverage/**'
    - '!**/*.md'
    - '!tsconfig*.json'
    - '!*.config.{ts,mts,cts,js,mjs,cjs}'
    - '!electron-builder.yml'
    - '!.vscode/**'
    - '!.github/**'
    # Las pruebas que las propias dependencias publican en npm. `zod` manda 189
    # archivos `.test.ts` y sus carpetas `tests/`: 381 entradas que no se
    # ejecutan nunca en la tienda. Lo encontró `verify:paquete` la primera vez
    # que corrió.
    - '!**/node_modules/**/{__tests__,__mocks__,test,tests,spec}/**'
    - '!**/node_modules/**/*.{test,spec}.{ts,tsx,js,mjs,cjs}'
    - '!**/node_modules/better-sqlite3/prebuilds/darwin-*.node'
    - '!**/node_modules/better-sqlite3/prebuilds/linux*.node'
    - '!**/node_modules/better-sqlite3/prebuilds/win32-arm64.node'
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # El nombre del `.exe` dentro de la instalación. Se escribe explícito aunque
  # coincida con `productName`, porque de acá sale lo que Jimmy ve en el
  # Administrador de tareas.
  executableName: POS Jimmy Cano
  # Sin firma: decisión pendiente. Windows va a mostrar «Windows protegió tu
  # PC» en la primera ejecución, que se saltea con «Más información» → «Ejecutar
  # de todas formas» y no impide instalar.
  signAndEditExecutable: true

nsis:
  # Con asistente, no de un clic: Jimmy tiene que poder ver y elegir dónde se
  # instala en vez de que aparezca instalado sin haber preguntado.
  oneClick: false
  allowToChangeInstallationDirectory: true
  # ---------------------------------------------------------------------------
  # LA LICENCIA
  # ---------------------------------------------------------------------------
  # Con un `.txt`, electron-builder inserta `MUI_PAGE_LICENSE` sin casilla ni
  # botones de opción (nsisLicense.js): la página muestra el texto y el botón
  # «Acepto». Sin pulsarlo no se avanza; la otra salida es «Cancelar».
  #
  # El archivo va en UTF-8 CON BOM y con CRLF. electron-builder convierte a
  # UTF-8 con BOM sus licencias localizadas (`license_xx.txt`), pero NO la que
  # se nombra acá, así que el BOM se escribe en el archivo. **No está medido
  # que sin BOM falle**: armado en macOS sin BOM, el texto llegó igual con sus
  # tildes. Se deja para no depender de cómo detecta la codificación el
  # `makensis` de la máquina que arme el instalador. El texto exacto lo fija
  # `instalador-marca-y-licencia.test.ts`.
  license: build/licencia.txt
  # La casilla del acceso directo y el título «Instalación de Vixo POS». Ver
  # los comentarios del propio archivo.
  include: build/instalador.nsh
  # Solo español. Sin esto el instalador carga todos los idiomas y elige el de
  # Windows: en un Windows en inglés el botón diría «I Agree», y la licencia
  # dice «Al hacer clic en "Acepto"». 3082 es el identificador de Spanish
  # (International), el que usa NSIS para `SpanishInternational`; con él se
  # escribe también la información de versión del instalador.
  installerLanguages:
    - es_ES
  language: '3082'
  # El acceso directo del menú Inicio se crea siempre. El del escritorio lo
  # crea electron-builder y la página de `instalador.nsh` lo quita si la
  # persona desmarcó la casilla. Queda en `true` y no en `false` a propósito:
  # con `false`, el desinstalador de electron-builder deja de borrarlo.
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: POS Jimmy Cano
  # Para todos los usuarios de la máquina, no solo para quien instala: la
  # terminal de la tienda puede tener una cuenta distinta a la de quien la
  # configura. Pide elevación una vez, al instalar.
  perMachine: true
  allowElevation: true
  # El instalador que se le manda a Jimmy, sin espacios: viaja por correo o por
  # un pendrive, y un nombre sin espacios no se rompe en ninguna de las dos.
  artifactName: POS-Jimmy-Cano-Setup-${version}.${ext}
  uninstallDisplayName: POS Jimmy Cano
  deleteAppDataOnUninstall: false

mac:
  target:
    - dmg
  category: public.app-category.business
  icon: build/icon.png
